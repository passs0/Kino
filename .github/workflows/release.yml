name: Build & Release DMG

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode with Icon Composer asset support
        run: |
          for xcode_path in \
            "/Applications/Xcode_26.6.app" \
            "/Applications/Xcode.app"; do
            if [ -d "$xcode_path" ]; then
              echo "Selecting $xcode_path"
              sudo xcode-select -s "$xcode_path"
              break
            fi
          done
          XCODE_VERSION="$(xcodebuild -version | awk '/^Xcode / { print $2; exit }')"
          XCODE_MAJOR="${XCODE_VERSION%%.*}"
          if [ -z "$XCODE_MAJOR" ] || [ "$XCODE_MAJOR" -lt 26 ]; then
            echo "Xcode 26.6 or later is required to compile the latest icon assets (found: ${XCODE_VERSION:-unknown})." >&2
            exit 1
          fi
          xcrun --find actool
          xcrun actool --version
          swift --version

      - name: Validate Swift package manifest
        run: swift package dump-package >/dev/null

      - name: Extract Tag or Version
        id: get_version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.1.1-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Application Bundle
        run: |
          export CI=true
          ./build_app.sh

      - name: Package DMG Disk Image
        run: |
          export CI=true
          ./scripts/package_dmg.sh

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kino-${{ steps.get_version.outputs.version }}-macOS
          path: "*.dmg"
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.dmg"
          name: "Kino v${{ steps.get_version.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
